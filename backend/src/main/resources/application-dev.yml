spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 50
      hibernate.search.backend.type: lucene
      hibernate.search.backend.directory.type: local-filesystem
      hibernate.search.backend.directory.root: ./files/indexes
      hibernate.search.backend.analysis.configurer: com.kmu.anki.backend.global.config.search.KoreanLuceneAnalysisConfigurerImpl
      hibernate.search.backend.lucene_version: 9.11
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CL_ID_DEV}
            client-secret: ${GOOGLE_CL_SECRET_DEV}
            redirect-uri: http://localhost:7070/api/auth/oauth2/google
            scope:
              - openid
              - email
              - profile
  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
#  sql:
#    init:
#      mode: always
#      encoding: UTF-8
#      separator: ;;

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    url: /docs/openapi3.yaml

server:
  port: 7070

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.kmu.anki.backend.domain