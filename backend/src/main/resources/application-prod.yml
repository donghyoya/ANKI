#application-prod.yml
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 50
      hibernate.search.backend.type: lucene
      hibernate.search.backend.directory.type: local-filesystem
      hibernate.search.backend.directory.root: ./files/indexes
      hibernate.search.backend.analysis.configurer: com.kmu.anki.backend.global.config.search.KoreanLuceneAnalysisConfigurerImpl
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CL_ID_PROD}
            client-secret: ${GOOGLE_CL_SECRET_PROD}
            redirect-uri: http://hada.zapto.org:7070/api/auth/oauth2/google
            scope:
              - openid
              - email
              - profile

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    url: /docs/openapi3.yaml

server:
  port: 7070

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.kmu.anki.backend.domain