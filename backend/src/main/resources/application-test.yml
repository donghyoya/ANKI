# application-test.yml
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/mydatabase
    username: myuser
    password: mypassword
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect
  sql:
    init:
      mode: always
      encoding: UTF-8
      separator: ;;
server:
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
  port: 7070

logging:
  config: classpath:logback/logback-test.xml

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.kmu.anki.backend.domain

