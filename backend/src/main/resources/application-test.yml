# application-test.yml
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/mydatabase
    username: myuser
    password: mypassword
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false
    properties:
      hibernate:
        default_batch_fetch_size: 50
      hibernate.search.backend.type: lucene
      hibernate.search.backend.directory.type: local-heap
      hibernate.search.backend.analysis.configurer: com.kmu.anki.backend.global.config.search.KoreanLuceneAnalysisConfigurerImpl

  sql:
    init:
      mode: always
      encoding: UTF-8
#      separator: ;;
