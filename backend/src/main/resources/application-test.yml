#            client-id: ${GOOGLE_CL_ID_DEV}
#            client-secret: ${GOOGLE_CL_SECRET_DEV}
#            redirect-uri: http://localhost:7070/api/auth/oauth2/google
#            scope:
#              - email
#              - profile
server:
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
  port: 7070

