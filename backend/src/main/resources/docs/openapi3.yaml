  /cards/{id}:
    get:
      tags:
      - Cards
      summary: Card 보기
      description: Card 보기
      operationId: card-controller-test/get-card
      parameters:
      - name: id
        in: path
        description: 카드의 고유번호
        required: true
        schema:
          type: string
      responses:
        "200":
          description: "200"
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: "#/components/schemas/card"
              examples:
                card-controller-test/get-card:
                  value: "{\"cardId\":1,\"koreanWord\":\"가\",\"foreignWord\":\"edge;\
                    \ verge\",\"level\":\"hard\",\"languageCode\":\"en\"}"
  /cards/{id}/details:
    get:
      tags:
      - Cards
      summary: Card에 대한 디테일한 정보 보기
      description: Card에 대한 디테일한 정보 보기
      operationId: card-controller-test/get-card-details
      parameters:
      - name: id
        in: path
        description: 카드의 고유번호
        required: true
        schema:
          type: string
      responses:
        "200":
          description: "200"
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: "#/components/schemas/cardDetail"
              examples:
                card-controller-test/get-card-details:
                  value: "{\"cardId\":1,\"koreanWord\":\"가\",\"foreignWord\":\"edge;\
                    \ verge\",\"level\":\"hard\",\"languageCode\":\"en\",\"originalLanguage\"\
                    :null,\"homographNumber\":\"1\",\"partsOfSpeech\":\"명사\",\"pronunciation\"\
                    :\"가ː\",\"relatedWords\":null,\"inflection\":null,\"exampleUsage\"\
                    :\"<구> 가를 꾸미다.\\n<구> 가를 장식하다.\\n<구> 가에 걸치다.\\n<구> 가에 달다.\\n<구\
                    > 가에 달라붙다.\\n<구> 가에 세우다.\\n<구> 가에 앉다.\\n<문장> 공원의 중앙에는 잔디밭이 있고\
                    \ 가에는 울타리가 둘러쳐져 있었다.\\n<문장> 민준이는 금방이라도 일어날 듯이 의자 가에 엉덩이만 살짝 걸치\
                    고 앉았다.\\n<대화> 가: 차는 어디에 주차했어요?\\n<대화> 나: 저기 운동장 가에 세워 뒀어요.\\n\\\
                    n\"}"
  /cards/{id}/study:
    get:
      tags:
      - StudyCards
      summary: Card 학습 정보 보기
      description: Card 학습 정보 보기
      operationId: user-card-controller-test/get-card-study-info
      parameters:
      - name: id
        in: path
        description: 카드의 고유번호
        required: true
        schema:
          type: string
      responses:
        "200":
          description: "200"
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: "#/components/schemas/cardStudyInfo"
              examples:
                user-card-controller-test/get-card-study-info:
                  value: "{\"cardId\":1,\"nextStudyDate\":\"2025-01-08T14:54:24.650406\"\
                    ,\"lapses\":0,\"lastReview\":null,\"reps\":0,\"scheduledDays\"\
                    :0.0,\"stability\":0.0,\"state\":\"New\"}"
    post:
      tags:
      - StudyCards
      summary: Card 학습결과를 갱신
      description: Card 학습결과를 갱신
      operationId: user-card-controller-test/put-user-cards
      parameters:
      - name: id
        in: path
        description: 카드의 고유번호
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json;charset=UTF-8:
            schema:
              $ref: "#/components/schemas/studyCardForm"
            examples:
              user-card-controller-test/put-user-cards:
                value: "{\"lapses\":5,\"reps\":72,\"due\":\"2025-01-08T14:54:26.543658\"\
                  ,\"scheduledDays\":0.9,\"lastReview\":\"2025-01-08T14:54:26.543658\"\
                  ,\"state\":\"Review\",\"stability\":1.3}"
      responses:
        "200":
          description: "200"
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: "#/components/schemas/cardStudyInfo"
              examples:
                user-card-controller-test/put-user-cards:
                  value: "{\"cardId\":74,\"nextStudyDate\":\"2025-01-08T14:54:26.543658\"\
                    ,\"lapses\":5,\"lastReview\":\"2025-01-08T14:54:26.543658\",\"\
                    reps\":72,\"scheduledDays\":0.9,\"stability\":1.3,\"state\":\"\
                    Review\"}"
