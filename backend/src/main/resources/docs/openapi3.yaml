openapi: 3.0.1
info:
  title: Anki
  description: Anki 작업
  version: 1.0.0
servers:
- url: http://localhost:8080/
tags: []
paths:
  /cards/{id}:
    get:
      tags:
      - Cards
      summary: Card 보기
      description: Card 보기
      operationId: card-controller-test/get-card
      parameters:
      - name: id
        in: path
        description: 카드의 고유번호
        required: true
        schema:
          type: string
      responses:
        "200":
          description: "200"
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: "#/components/schemas/card"
              examples:
                card-controller-test/get-card:
                  value: "{\"cardId\":1,\"koreanWord\":\"안녕\",\"foreignWord\":\"hello\"\
                    ,\"level\":\"easy\",\"languageCode\":\"en\"}"
  /cards/{id}/details:
    get:
      tags:
      - Cards
      summary: Card에 대한 디테일한 정보 보기
      description: Card에 대한 디테일한 정보 보기
      operationId: card-controller-test/get-card-details
      parameters:
      - name: id
        in: path
        description: 카드의 고유번호
        required: true
        schema:
          type: string
      responses:
        "200":
          description: "200"
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: "#/components/schemas/cardDetail"
              examples:
                card-controller-test/get-card-details:
                  value: "{\"cardId\":1,\"koreanWord\":\"안녕\",\"foreignWord\":\"hello\"\
                    ,\"level\":\"easy\",\"languageCode\":\"en\",\"headword\":null,\"\
                    homographNumber\":null,\"partsOfSpeech\":null,\"pronunciation\"\
                    :null,\"relatedWords\":null,\"inflection\":null,\"exampleUsage\"\
                    :null}"
  /cards/{id}/study:
    get:
      tags:
      - StudyCards
      summary: Card 학습 정보 보기
      description: Card 학습 정보 보기
      operationId: user-card-controller-test/get-card-study-info
      parameters:
      - name: id
        in: path
        description: 카드의 고유번호
        required: true
        schema:
          type: string
      responses:
        "200":
          description: "200"
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: "#/components/schemas/cardStudyInfo"
              examples:
                user-card-controller-test/get-card-study-info:
                  value: "{\"cardId\":1,\"nextStudyDate\":\"2025-01-11T15:13:09.832045\"\
                    ,\"lapses\":null,\"lastReview\":null,\"reps\":null,\"scheduledDays\"\
                    :null,\"stability\":null,\"state\":\"New\"}"
  /decks:
    get:
      tags:
      - Decks
      summary: 검색어 조건에 맞는 Deck 보기
      description: 검색어 조건에 맞는 Deck 보기
      operationId: deck-controller-test/get-decks-by-
      parameters:
      - name: queryType
        in: query
        description: 의미에 따른 분류인가 (level) / 난이도에 따른 분류인가 (meaning)
        required: true
        schema:
          type: string
      responses:
        "200":
          description: "200"
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: "#/components/schemas/decks"
              examples:
                deck-controller-test/get-decks-by-difficulty:
                  value: "{\"size\":3,\"content\":[{\"category\":\"easy\",\"cardCounts\"\
                    :20,\"overdueCounts\":20,\"maturitiyCounts\":0,\"overdueRate\"\
                    :1.0,\"maturitiyRate\":0.0},{\"category\":\"hard\",\"cardCounts\"\
                    :20,\"overdueCounts\":20,\"maturitiyCounts\":0,\"overdueRate\"\
                    :1.0,\"maturitiyRate\":0.0},{\"category\":\"normal\",\"cardCounts\"\
                    :20,\"overdueCounts\":20,\"maturitiyCounts\":0,\"overdueRate\"\
                    :1.0,\"maturitiyRate\":0.0}]}"
                deck-controller-test/get-decks-by-meaning:
                  value: "{\"size\":2,\"content\":[{\"category\":\"Anything\",\"cardCounts\"\
                    :20,\"overdueCounts\":20,\"maturitiyCounts\":0,\"overdueRate\"\
                    :1.0,\"maturitiyRate\":0.0},{\"category\":\"Something\",\"cardCounts\"\
                    :40,\"overdueCounts\":40,\"maturitiyCounts\":0,\"overdueRate\"\
                    :1.0,\"maturitiyRate\":0.0}]}"
  /decks/cards:
    get:
      tags:
      - Decks
      summary: 덱에 포함된 카드 모음
      description: 덱에 포함된 카드 모음
      operationId: deck-controller-test/get-decks-card
      parameters:
      - name: queryType
        in: query
        description: 의미에 따른 분류인가 (level) / 난이도에 따른 분류인가 (meaning)
        required: true
        schema:
          type: string
      - name: query
        in: query
        description: 검색어 (easy-normal-hard 등)
        required: true
        schema:
          type: string
      responses:
        "200":
          description: "200"
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: "#/components/schemas/cards"
              examples:
                deck-controller-test/get-decks-card:
                  value: "{\"page\":0,\"pageSize\":1,\"size\":20,\"content\":[{\"\
                    cardId\":1,\"koreanWord\":\"안녕\",\"foreignWord\":\"hello\",\"\
                    level\":\"easy\",\"languageCode\":\"en\"},{\"cardId\":2,\"koreanWord\"\
                    :\"사과\",\"foreignWord\":\"apple\",\"level\":\"easy\",\"languageCode\"\
                    :\"en\"},{\"cardId\":3,\"koreanWord\":\"물\",\"foreignWord\":\"\
                    water\",\"level\":\"easy\",\"languageCode\":\"en\"},{\"cardId\"\
                    :4,\"koreanWord\":\"책\",\"foreignWord\":\"book\",\"level\":\"\
                    easy\",\"languageCode\":\"en\"},{\"cardId\":5,\"koreanWord\":\"\
                    밥\",\"foreignWord\":\"rice\",\"level\":\"easy\",\"languageCode\"\
                    :\"en\"},{\"cardId\":6,\"koreanWord\":\"학교\",\"foreignWord\":\"\
                    school\",\"level\":\"easy\",\"languageCode\":\"en\"},{\"cardId\"\
                    :7,\"koreanWord\":\"공\",\"foreignWord\":\"ball\",\"level\":\"\
                    easy\",\"languageCode\":\"en\"},{\"cardId\":8,\"koreanWord\":\"\
                    연필\",\"foreignWord\":\"pencil\",\"level\":\"easy\",\"languageCode\"\
                    :\"en\"},{\"cardId\":9,\"koreanWord\":\"의자\",\"foreignWord\":\"\
                    chair\",\"level\":\"easy\",\"languageCode\":\"en\"},{\"cardId\"\
                    :10,\"koreanWord\":\"친구\",\"foreignWord\":\"friend\",\"level\"\
                    :\"easy\",\"languageCode\":\"en\"},{\"cardId\":11,\"koreanWord\"\
                    :\"우유\",\"foreignWord\":\"milk\",\"level\":\"easy\",\"languageCode\"\
                    :\"en\"},{\"cardId\":12,\"koreanWord\":\"하늘\",\"foreignWord\"\
                    :\"sky\",\"level\":\"easy\",\"languageCode\":\"en\"},{\"cardId\"\
                    :13,\"koreanWord\":\"강아지\",\"foreignWord\":\"puppy\",\"level\"\
                    :\"easy\",\"languageCode\":\"en\"},{\"cardId\":14,\"koreanWord\"\
                    :\"고양이\",\"foreignWord\":\"cat\",\"level\":\"easy\",\"languageCode\"\
                    :\"en\"},{\"cardId\":15,\"koreanWord\":\"집\",\"foreignWord\":\"\
                    house\",\"level\":\"easy\",\"languageCode\":\"en\"},{\"cardId\"\
                    :16,\"koreanWord\":\"사람\",\"foreignWord\":\"person\",\"level\"\
                    :\"easy\",\"languageCode\":\"en\"},{\"cardId\":17,\"koreanWord\"\
                    :\"나무\",\"foreignWord\":\"tree\",\"level\":\"easy\",\"languageCode\"\
                    :\"en\"},{\"cardId\":18,\"koreanWord\":\"바다\",\"foreignWord\"\
                    :\"sea\",\"level\":\"easy\",\"languageCode\":\"en\"},{\"cardId\"\
                    :19,\"koreanWord\":\"시간\",\"foreignWord\":\"time\",\"level\":\"\
                    easy\",\"languageCode\":\"en\"},{\"cardId\":20,\"koreanWord\"\
                    :\"꽃\",\"foreignWord\":\"flower\",\"level\":\"easy\",\"languageCode\"\
                    :\"en\"}]}"
  /user/option:
    post:
      tags:
      - Users
      operationId: user-option-controller-test/put-user-option
      requestBody:
        content:
          application/json;charset=UTF-8:
            schema:
              $ref: "#/components/schemas/userOption"
            examples:
              user-option-controller-test/put-user-option:
                value: "{\"todayReviewWords\":200,\"todayStudyWords\":200,\"id\":1,\"\
                  languageCode\":\"en\"}"
      responses:
        "200":
          description: "200"
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: "#/components/schemas/userOption"
              examples:
                user-option-controller-test/put-user-option:
                  value: "{\"id\":1,\"todayStudyWords\":200,\"todayReviewWords\":200,\"\
                    languageCode\":\"en\"}"
  /user/option/{id}:
    get:
      tags:
      - Users
      operationId: user-option-controller-test/get-user-option
      parameters:
      - name: id
        in: path
        description: option을 보고자 하는 user의 id
        required: true
        schema:
          type: string
      responses:
        "200":
          description: "200"
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: "#/components/schemas/userOption"
              examples:
                user-option-controller-test/get-user-option:
                  value: "{\"id\":1,\"todayStudyWords\":200,\"todayReviewWords\":200,\"\
                    languageCode\":\"en\"}"
components:
  schemas:
    userOption:
      title: userOption
      type: object
      properties:
        todayReviewWords:
          type: number
          description: 오늘 복습할 단어 수
        todayStudyWords:
          type: number
          description: 오늘 공부할 단어 수
        id:
          type: number
          description: user의 고유번호
        languageCode:
          type: string
          description: 어떤 언어로 학습할지 그 언어코드
    cards:
      title: cards
      type: object
      properties:
        size:
          type: number
          description: content의 크기
        pageSize:
          type: number
          description: 전체 페이지의 크기
        page:
          type: number
          description: 현재 페이지의 번호
        content:
          type: array
          description: 실제 데이터들
          items:
            type: object
            properties:
              level:
                type: string
                description: "단어의 수준 (easy, normal, hard)"
              cardId:
                type: number
                description: 단어카드의 고유번호
              koreanWord:
                type: string
                description: 한국어 단어
              languageCode:
                type: string
                description: 언어코드 (ISO 639-1)
              foreignWord:
                type: string
                description: 외국어 단어
    decks:
      title: decks
      type: object
      properties:
        size:
          type: number
          description: content의 크기
        content:
          type: array
          description: 실제 데이터들
          items:
            type: object
            properties:
              overdueRate:
                type: number
                description: due가 지난 상태인 카드 비율
              cardCounts:
                type: number
                description: 덱에 포함된 카드 개수
              overdueCounts:
                type: number
                description: due가 지난 상태인 카드 개수
              maturitiyRate:
                type: number
                description: "state가 review인 카드 비율:"
              category:
                type: string
                description: 카드 분류
              maturitiyCounts:
                type: number
                description: state가 review인 카드 개수
    card:
      title: card
      type: object
      properties:
        level:
          type: string
          description: "단어의 수준 (easy, normal, hard)"
        cardId:
          type: number
          description: 단어카드의 고유번호
        koreanWord:
          type: string
          description: 한국어 단어
        languageCode:
          type: string
          description: 언어코드 (ISO 639-1)
        foreignWord:
          type: string
          description: 외국어 단어
    cardStudyInfo:
      title: cardStudyInfo
      type: object
      properties:
        cardId:
          type: number
          description: Card의 고유번호
        nextStudyDate:
          type: string
          description: 다음 학습할 날짜
        state:
          type: string
          description: 카드의 현재 상태
    cardDetail:
      title: cardDetail
      type: object
      properties:
        level:
          type: string
          description: "단어의 수준 (easy, normal, hard)"
        cardId:
          type: number
          description: 단어카드의 고유번호
        koreanWord:
          type: string
          description: 한국어 단어
        languageCode:
          type: string
          description: 언어코드 (ISO 639-1)
        foreignWord:
          type: string
          description: 외국어 단어
