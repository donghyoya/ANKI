        todayStudyWords:
          type: number
          description: 오늘 공부할 단어 수
        id:
          type: number
          description: user의 고유번호
        languageCode:
          type: string
          description: 어떤 언어로 학습할지 그 언어코드
    cardStudyInfo:
      title: cardStudyInfo
      type: object
      properties:
        lapses:
          type: number
          description: Again을 누른 횟수
        reps:
          type: number
          description: 총 복습횟수
        scheduledDays:
          type: number
          description: 현재 복습 간격
        cardId:
          type: number
          description: Card의 고유번호
        lastReview:
          type: string
          description: 마지막으로 복습한 날짜
        nextStudyDate:
          type: string
          description: 다음 학습할 날짜
        state:
          type: string
          description: 카드의 현재 상태
        stability:
          type: number
          description: 기억의 안정도
