openapi: 3.0.1
info:
  title: Anki
  description: Anki 작업
  version: 1.0.0
servers:
- url: http://localhost:8080/
tags: []
paths:
  /cards/study:
    get:
      tags:
      - StudyCards
      summary: '오늘 공부할 카드 모음 '
      description: '오늘 공부할 카드 모음 '
      operationId: user-card-controller-test/get-study-card/
      parameters:
      - name: studyType
        in: query
        description: study냐 review냐
        required: true
        schema:
          type: string
          enum:
          - study
          - review
      - name: queryType
        in: query
        description: "난이도 기준 검색인지, 의미상 구분에 따른 검색인지"
        required: true
        schema:
          type: string
          enum:
          - level
          - meaning
      - name: query
        in: query
        description: 검색어 (easy-normal-hard 등)
        required: true
        schema:
          type: string
          enum:
          - easy
          - normal
          - hard
          - CONCEPT
          - ECONOMY
          - SCIENCE
          - TRANSPORT
          - WEATHER
          - NEWS
          - FEELING
          - GRAMMAR_AND_LANGUAGE
          - CULTURE
          - HOSPITAL
          - LIFE
          - LIVING
          - PERSONALITY
          - NUMBER
          - COMMUNICATION
          - TIME
          - FOOD
          - RELATIONSHIPS
          - NATURE
          - POLITICS
          - RELIGION
          - WORK
          - HOME
          - FASHION_AND_APPEARANCE
          - SCHOOL
          - ACTION
          - ADMINISTRATION
      responses:
        "200":
          description: "200"
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: "#/components/schemas/userCards"
