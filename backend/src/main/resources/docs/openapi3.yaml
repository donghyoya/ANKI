components:
  schemas:
    studyCardForm:
      title: studyCardForm
      type: object
      properties:
        lapses:
          type: number
          description: Again을 누른 횟수
        reps:
          type: number
          description: 총 복습횟수
        scheduledDays:
          type: number
          description: 현재 복습 간격
        lastReview:
          type: string
          description: 마지막으로 복습한 날짜
        nextStudyDate:
          type: string
          description: 다음 학습할 날짜
        state:
          type: string
          description: 카드의 현재 상태
        stability:
          type: number
          description: 기억의 안정도
    userOption:
      title: userOption
      type: object
      properties:
        todayReviewWords:
          type: number
          description: 오늘 복습할 단어 수
        todayStudyWords:
          type: number
          description: 오늘 공부할 단어 수
        id:
          type: number
          description: user의 고유번호
        languageCode:
          type: string
          description: 어떤 언어로 학습할지 그 언어코드
    cardStudyInfo:
      title: cardStudyInfo
      type: object
      properties:
        cardId:
          type: number
          description: Card의 고유번호
        nextStudyDate:
          type: string
          description: 다음 학습할 날짜
        state:
          type: string
          description: 카드의 현재 상태
    decks:
      title: decks
      type: object
      properties:
        size:
          type: number
          description: content의 크기
        content:
          type: array
          description: 실제 데이터들
          items:
            type: object
            properties:
              overdueRate:
                type: number
                description: due가 지난 상태인 카드 비율
              cardCounts:
                type: number
                description: 덱에 포함된 카드 개수
              maturitiyRate:
                type: number
                description: "state가 review인 카드 비율:"
              category:
                type: string
                description: 카드 분류
    card:
      title: card
      type: object
      properties:
        languageCode:
          type: string
          description: 언어코드 (ISO 639-1)
        foreignWord:
          type: string
          description: 외국어 단어
        difficulty:
          type: string
          description: "언어의 난이도 (easy, normal, hard)"
        cardId:
          type: number
          description: 단어카드의 고유번호
        nextStudyDate:
          type: string
          description: 다음 학습할 날짜
        koreanWord:
          type: string
          description: 한국어 단어
        userCardId:
          type: number
          description: userCard의 고유번호
        state:
          type: string
          description: 카드의 현재 상태
    cards:
      title: cards
      type: object
      properties:
        size:
          type: number
          description: content의 크기
        pageSize:
          type: number
          description: 전체 페이지의 크기
        page:
          type: number
          description: 현재 페이지의 번호
        content:
          type: array
          description: 실제 데이터들
          items:
            type: object
            properties:
              difficulty:
                type: string
                description: "언어의 난이도 (easy, normal, hard)"
              cardId:
                type: number
                description: 단어카드의 고유번호
              koreanWord:
                type: string
                description: 한국어 단어
              languageCode:
                type: string
                description: 언어코드 (ISO 639-1)
              foreignWord:
                type: string
                description: 외국어 단어
    userCards:
      title: userCards
      type: object
      properties:
        size:
          type: number
          description: content의 크기
        pageSize:
          type: number
          description: 전체 페이지의 크기
        page:
          type: number
          description: 현재 페이지의 번호
        content:
          type: array
          description: 실제 데이터들
          items:
