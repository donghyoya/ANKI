  /cards/{id}:
    get:
      tags:
      - Cards
      summary: Card 보기
      description: Card 보기
      operationId: card-controller-test/get-card
      parameters:
      - name: id
        in: path
        description: 카드의 고유번호
        required: true
        schema:
          type: string
      responses:
        "200":
          description: "200"
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: "#/components/schemas/card"
              examples:
                card-controller-test/get-card:
                  value: "{\"cardId\":1,\"koreanWord\":\"안녕\",\"foreignWord\":\"hello\"\
                    ,\"level\":\"easy\",\"languageCode\":\"en\"}"
