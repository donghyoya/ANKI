                    ,\"lapses\":null,\"lastReview\":null,\"reps\":null,\"scheduledDays\"\
                    :null,\"stability\":null,\"state\":\"New\"}"
    post:
      tags:
      - StudyCards
      summary: Card 학습결과를 갱신
      description: Card 학습결과를 갱신
      operationId: user-card-controller-test/put-user-cards
      parameters:
      - name: id
        in: path
        description: card 고유번호
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json;charset=UTF-8:
            schema:
              $ref: "#/components/schemas/studyCardForm"
            examples:
              user-card-controller-test/put-user-cards:
                value: "{\"lapses\":5,\"reps\":72,\"scheduledDays\":0.9,\"nextStudyDate\"\
                  :\"2024-12-27T19:49:23.0303919\",\"lastReview\":\"2024-12-27T19:49:23.0303919\"\
                  ,\"state\":\"Review\",\"stability\":1.3}"
      responses:
        "200":
          description: "200"
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: "#/components/schemas/cardStudyInfo"
              examples:
                user-card-controller-test/put-user-cards:
                  value: "{\"cardId\":1,\"nextStudyDate\":\"2024-12-27T19:49:23.0303919\"\
                    ,\"lapses\":5,\"lastReview\":\"2024-12-27T19:49:23.0303919\",\"\
                    reps\":72,\"scheduledDays\":0.9,\"stability\":1.3,\"state\":\"\
                    Review\"}"
