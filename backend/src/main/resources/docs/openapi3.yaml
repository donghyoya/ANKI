  /cards/{id}:
    get:
      tags:
      - Cards
      summary: Card 보기
      description: Card 보기
      operationId: card-controller-test/get-card
      parameters:
      - name: id
        in: path
        description: 카드의 고유번호
        required: true
        schema:
          type: string
      responses:
        "200":
          description: "200"
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: "#/components/schemas/card"
              examples:
                card-controller-test/get-card:
                  value: "{\"cardId\":1,\"koreanWord\":\"안녕\",\"foreignWord\":\"hello\"\
                    ,\"level\":\"easy\",\"languageCode\":\"en\"}"
  /cards/{id}/details:
    get:
      tags:
      - Cards
      summary: Card에 대한 디테일한 정보 보기
      description: Card에 대한 디테일한 정보 보기
      operationId: card-controller-test/get-card-details
      parameters:
      - name: id
        in: path
        description: 카드의 고유번호
        required: true
        schema:
          type: string
      responses:
        "200":
          description: "200"
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: "#/components/schemas/cardDetail"
              examples:
                card-controller-test/get-card-details:
                  value: "{\"cardId\":1,\"koreanWord\":\"안녕\",\"foreignWord\":\"hello\"\
                    ,\"level\":\"easy\",\"languageCode\":\"en\",\"headword\":null,\"\
                    homographNumber\":null,\"partsOfSpeech\":null,\"pronunciation\"\
                    :null,\"relatedWords\":null,\"inflection\":null,\"exampleUsage\"\
                    :null}"
  /cards/{id}/study:
    get:
      tags:
      - StudyCards
      summary: Card 학습 정보 보기
      description: Card 학습 정보 보기
      operationId: user-card-controller-test/get-card-study-info
      parameters:
      - name: id
        in: path
        description: 카드의 고유번호
        required: true
        schema:
          type: string
      responses:
        "200":
          description: "200"
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: "#/components/schemas/cardStudyInfo"
              examples:
                user-card-controller-test/get-card-study-info:
                  value: "{\"cardId\":1,\"nextStudyDate\":\"2025-01-05T16:43:36.123733\"\
                    ,\"lapses\":0,\"lastReview\":null,\"reps\":0,\"scheduledDays\"\
                    :0.0,\"stability\":0.0,\"state\":\"New\"}"
    post:
      tags:
      - StudyCards
      summary: Card 학습결과를 갱신
      description: Card 학습결과를 갱신
      operationId: user-card-controller-test/put-user-cards
      parameters:
      - name: id
        in: path
        description: 카드의 고유번호
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json;charset=UTF-8:
            schema:
              $ref: "#/components/schemas/studyCardForm"
            examples:
              user-card-controller-test/put-user-cards:
                value: "{\"lapses\":5,\"reps\":72,\"scheduledDays\":0.9,\"nextStudyDate\"\
                  :\"2025-01-05T16:43:36.2393318\",\"lastReview\":\"2025-01-05T16:43:36.2393318\"\
                  ,\"state\":\"Review\",\"stability\":1.3}"
      responses:
        "200":
          description: "200"
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: "#/components/schemas/cardStudyInfo"
              examples:
                user-card-controller-test/put-user-cards:
                  value: "{\"cardId\":1,\"nextStudyDate\":\"2025-01-05T16:43:36.2393318\"\
                    ,\"lapses\":5,\"lastReview\":\"2025-01-05T16:43:36.2393318\",\"\
                    reps\":72,\"scheduledDays\":0.9,\"stability\":1.3,\"state\":\"\
                    Review\"}"
