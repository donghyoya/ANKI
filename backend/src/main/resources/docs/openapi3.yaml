openapi: 3.0.1
info:
  title: Anki
  description: Anki 작업
  version: 1.0.0
servers:
- url: /
  description: 현재 호스트에서 사용
- url: https://virtserver.swaggerhub.com/js990311/Anki/1.0.0
  description: swagger-hub에서 사용
tags: []
paths:
  /auth/token:
    get:
      tags:
      - Authentication
      summary: "실제 사용하는 토큰 발급하기. 단 authenticationToken, refreshToken만 사용할 것"
      description: "실제 사용하는 토큰 발급하기. 단 authenticationToken, refreshToken만 사용할 것"
      operationId: authentication-controller-test/get-auth-token
      responses:
        "200":
          description: "200"
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: "#/components/schemas/TokenProviderSchema"
              examples:
                authentication-controller-test/get-auth-token:
                  value: "{\"accessToken\":\"eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9.eyJ1c2VySWQiOjEsInJvbGUiOiJST0xFX1VTRVIiLCJzdWIiOiIxIiwiaWF0IjoxNzQ5OTc4NDE2LCJleHAiOjE3NTAwNjQ4MTZ9.CIgWi9ks7WTuhM_ggF7SLtezh5LXwwkFd5kl-2ykr9c\"\
                    ,\"refreshToken\":\"eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9.eyJ1c2VySWQiOjEsInJvbGUiOiJST0xFX1JFRlJFU0giLCJzdWIiOiIxIiwiaWF0IjoxNzQ5OTc4NDE2LCJleHAiOjE3NTA1ODMyMTZ9.K-PED2zjX0Cl54M810hl7oRjePFSvdqe-tkFflgvIkw\"\
                    ,\"isSetup\":true}"
      security:
      - bearerAuthJWT: []
  /auth-test:
    get:
      tags:
      - AuthTest
      summary: '인증이 되는지 테스트하기 '
      description: '인증이 되는지 테스트하기 '
      operationId: authentication-test-controller-test/auth-test
      responses:
        "200":
          description: "200"
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: "#/components/schemas/AuthTestSchema"
              examples:
                authentication-test-controller-test/auth-test:
                  value: "{\"username\":\"testUser\"}"
      security:
      - bearerAuthJWT: []
  /cards/delete-cache:
    get:
      tags:
      - StudyCards
      summary: 디버그용 캐시삭제 로직
      description: 디버그용 캐시삭제 로직
      operationId: user-card-controller-test/delete-cache
      parameters:
      - name: studyType
        in: query
        description: study냐 review냐
        required: true
        schema:
          type: string
          enum:
          - study
          - review
      - name: queryType
        in: query
        description: "난이도 기준 검색인지, 의미상 구분에 따른 검색인지"
        required: true
        schema:
          type: string
          enum:
          - level
          - meaning
      - name: query
        in: query
        description: 검색어 (easy-normal-hard 등)
        required: true
        schema:
          type: string
          enum:
          - easy
          - normal
          - hard
          - CONCEPT
          - ECONOMY
          - SCIENCE
          - TRANSPORT
          - WEATHER
          - NEWS
          - FEELING
          - GRAMMAR_AND_LANGUAGE
          - CULTURE
          - HOSPITAL
          - LIFE
          - LIVING
          - PERSONALITY
          - NUMBER
          - COMMUNICATION
          - TIME
          - FOOD
          - RELATIONSHIPS
          - NATURE
          - POLITICS
          - RELIGION
          - WORK
          - HOME
          - FASHION_AND_APPEARANCE
          - SCHOOL
          - ACTION
          - ADMINISTRATION
      responses:
        "200":
          description: "200"
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: "#/components/schemas/cards-delete-cache-227398068"
              examples:
                user-card-controller-test/delete-cache:
                  value: "{\"message\":\"cache-deleted\"}"
      security:
      - bearerAuthJWT: []
  /cards/foreign-search:
    get:
      tags:
      - CardSearch
      summary: 외국어 검색결과
      description: 외국어 검색결과
      operationId: card-search-controller-test/search-foreign-word
      parameters:
      - name: query
        in: query
        description: 검색어
        required: true
        schema:
          type: string
      - name: option
        in: query
        description: 외국어 검색 옵션 (용어검색 / 의미 검색 / 동시검색)
        required: true
        schema:
          type: string
          enum:
          - FOREIGN_WORD
          - FOREIGN_MEANING
          - BOTH
      - name: page
        in: query
        description: Page 넘버 (1부터 시작)
        required: true
        schema:
          type: string
      - name: pageSize
        in: query
        description: 페이지에 포함된 컨텐츠 크기
        required: true
        schema:
          type: string
      responses:
        "200":
          description: "200"
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: "#/components/schemas/foreignCardSearchResults"
              examples:
                card-search-controller-test/search-foreign-word:
                  value: "{\"page\":1,\"pageSize\":1,\"size\":1,\"content\":[{\"koreanCard\"\
                    :{\"cardId\":1,\"koreanWord\":\"한국어\",\"homographNumber\":\"1\"\
                    ,\"level\":\"easy\",\"topics\":[]},\"foreignCard\":{\"originalLanguage\"\
                    :\"원어\",\"partsOfSpeech\":\"품사\",\"pronunciation\":\"발음\",\"relatedWords\"\
                    :\"관련어\",\"inflection\":\"활용\",\"exampleUsage\":\"용례\",\"languageCode\"\
                    :null,\"foreignWord\":\"query\",\"foreignMeaning\":\"query\"}}]}"
  /cards/korean-search:
    get:
      tags:
      - CardSearch
      summary: 한국어 검색결과
      description: 한국어 검색결과
      operationId: card-search-controller-test/search-korean-card
      parameters:
      - name: query
        in: query
        description: 검색어
        required: true
        schema:
          type: string
      - name: code
        in: query
        description: 검색하고자 하는 언어 코드
        required: true
        schema:
          type: string
          enum:
          - mn
          - ar
          - zh
          - vi
          - th
          - id
          - ru
          - en
          - ja
          - fr
          - es
      - name: page
        in: query
        description: Page 넘버 (1부터 시작)
        required: true
        schema:
          type: string
      - name: pageSize
        in: query
        description: 페이지에 포함된 컨텐츠 크기
        required: true
        schema:
          type: string
      responses:
        "200":
          description: "200"
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: "#/components/schemas/koreanCardWithForeignWords"
              examples:
                card-search-controller-test/search-korean-card:
                  value: "{\"page\":1,\"pageSize\":1,\"size\":1,\"content\":[{\"cardId\"\
                    :1,\"koreanWord\":\"검색어\",\"homographNumber\":\"1\",\"level\"\
                    :\"easy\",\"topics\":[\"CULTURE\"],\"foreignWords\":[\"ENGLISH\"\
                    ]}]}"
