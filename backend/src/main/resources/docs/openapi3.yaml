      description: userCard 보기
      operationId: user-card-controller-test/get-user-cards
      parameters:
      - name: id
        in: path
        description: userCard 고유번호
        required: true
        schema:
          type: string
      responses:
        "200":
          description: "200"
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: "#/components/schemas/userCard"
              examples:
                user-card-controller-test/get-user-cards:
                  value: "{\"cardId\":1,\"koreanWord\":\"가족\",\"foreignWord\":\"Family\"\
                    ,\"difficulty\":\"easy\",\"languageCode\":\"en\",\"userCardId\"\
                    :1,\"score\":null,\"nextStudyDate\":\"2024-12-24T15:47:19.787685\"\
                    ,\"lapses\":5,\"lastReview\":\"2024-12-24T15:47:19.787685\",\"\
                    reps\":72,\"scheduledDays\":0.9,\"stability\":1.3,\"state\":\"\
                    Review\"}"
    post:
      tags:
      - Cards
      summary: Card 학습결과를 갱신
      description: Card 학습결과를 갱신
      operationId: user-card-controller-test/put-user-cards
      parameters:
      - name: id
        in: path
        description: userCard 고유번호
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json;charset=UTF-8:
            schema:
              $ref: "#/components/schemas/studyCardForm"
            examples:
              user-card-controller-test/put-user-cards:
                value: "{\"lapses\":5,\"reps\":72,\"scheduledDays\":0.9,\"nextStudyDate\"\
                  :\"2024-12-24T15:47:19.7876852\",\"lastReview\":\"2024-12-24T15:47:19.7876852\"\
                  ,\"state\":\"Review\",\"stability\":1.3}"
      responses:
        "200":
          description: "200"
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: "#/components/schemas/userCard"
              examples:
                user-card-controller-test/put-user-cards:
                  value: "{\"cardId\":1,\"koreanWord\":\"가족\",\"foreignWord\":\"Family\"\
                    ,\"difficulty\":\"easy\",\"languageCode\":\"en\",\"userCardId\"\
                    :1,\"score\":null,\"nextStudyDate\":\"2024-12-24T15:47:19.7876852\"\
                    ,\"lapses\":5,\"lastReview\":\"2024-12-24T15:47:19.7876852\",\"\
